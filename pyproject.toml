[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "platform-cost-guard"
version = "1.0.0"
description = "Read-only AWS waste finder with monthly cost estimates, budget gate and weekly report"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["boto3>=1.34"]

[project.optional-dependencies]
dev = ["pytest>=8", "moto[ec2,cloudwatch]>=5", "ruff>=0.6"]

[project.scripts]
cost-guard = "cost_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
