name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Unit tests (AWS mocked with moto, no credentials)
        run: pytest -v
      - name: CLI smoke test
        run: cost-guard --version && cost-guard --help > /dev/null
      - name: Offline demo (moto)
        run: python examples/demo.py | tee -a "$GITHUB_STEP_SUMMARY"

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/github-oidc-role
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  iam-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Policy is read-only and matches the Terraform module
        run: |
          python - <<'PY'
          import json, re
          policy = json.load(open("docs/iam-policy.json"))
          actions = {a for s in policy["Statement"] for a in s["Action"]}
          bad = [a for a in actions if not re.match(r"^(ec2:Describe|cloudwatch:GetMetricStatistics$)", a)]
          assert not bad, f"non read-only actions: {bad}"
          tf = open("terraform/github-oidc-role/main.tf").read()
          missing = [a for a in actions if f'"{a}"' not in tf]
          assert not missing, f"missing from terraform: {missing}"
          print("ok:", sorted(actions))
          PY
